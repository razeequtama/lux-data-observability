name: lux-data-observability

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: lux-backend
    ports:
      - "8000:8000"
    environment:
      - LUX_ENV=production
      - LUX_LOG_LEVEL=INFO
      - LUX_DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - lux-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: lux-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - lux-network

networks:
  lux-network:
    driver: bridge

